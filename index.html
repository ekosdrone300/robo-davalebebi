<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboClub | სასწავლო პლატფორმა</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <!-- გვერდითა პანელი -->
        <aside class="sidebar">
            <div class="logo">⚡ RoboClub</div>
            <ul class="menu">
                <li class="active" id="btn-tasks">💡 დავალებები</li>
                <li id="btn-leaderboard">🏆 რეიტინგი</li>
                <li id="btn-teacher-panel" class="hidden">⚙️ მასწავლებლის პანელი</li>
            </ul>
            <div class="user-info">
                <div class="avatar">👤</div>
                <span id="user-name">სტუმარი</span>
                <button id="btn-login" class="auth-btn">შესვლა</button>
            </div>
        </aside>

        <!-- მთავარი სამუშაო სივრცე -->
        <main class="content">
            <header>
                <h1 id="page-title">დავალება #1: LED ნათურის ანთება</h1>
                <div class="score-display">ჩემი ქულა: <span id="student-score">0</span></div>
            </header>

            <div class="workspace">
                <p class="instruction"><strong>ინსტრუქცია:</strong> დააკავშირე Arduino-ს <b>Pin 13</b> ნათურის <b>ანოდთან (+)</b>, ხოლო <b>GND</b> — <b>კათოდთან (-)</b>.</p>
                
                <div class="circuit-board" id="circuit-board">
                    <!-- ვირტუალური სადენების ფენა -->
                    <svg id="wires-svg" class="wires-layer"></svg>

                    <!-- არდუინო -->
                    <div class="component arduino" id="comp-arduino">
                        <div class="comp-title">Arduino Uno</div>
                        <div class="pins">
                            <div class="pin" data-id="pin-13" data-type="power">Pin 13</div>
                            <div class="pin" data-id="pin-gnd" data-type="gnd">GND</div>
                        </div>
                    </div>

                    <!-- LED ნათურა -->
                    <div class="component led" id="comp-led">
                        <div class="comp-title">LED ნათურა</div>
                        <div class="pins">
                            <div class="pin" data-id="led-anode" data-type="power">ანოდი (+)</div>
                            <div class="pin" data-id="led-cathode" data-type="gnd">კათოდი (-)</div>
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <button id="btn-check" class="primary-btn">✔️ შემოწმება</button>
                    <button id="btn-clear" class="secondary-btn">🗑️ გასუფთავება</button>
                </div>
                <div id="status-message"></div>
            </div>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
